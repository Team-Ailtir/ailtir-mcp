name: Code Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    name: Lint, Type-check, Test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v3

      - name: install dev dependencies
        run: make install-dev

      - name: checks
        run: make checks

      - name: unit tests
        env:
          AILTIR_MCP_SECRET: test-token-for-ci
        run: make tests-unit
