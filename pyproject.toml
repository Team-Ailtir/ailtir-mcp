[project]
name = "ailtir-mcp"
version = "0.1.0"
description = "Ailtir MCP server — upload, analyse, list, and chat with knowledge bases"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alogging>=2.2.0",
    "anyio>=4.9.0",
    "boto3>=1.39.8",
    "fastapi>=0.135.1",
    "httpx>=0.28.1",
    "mcp[cli]>=1.9.0",
    "pydantic-settings>=2.10.1",
    "structlog>=25.4.0",
    "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
    "bandit>=1.8.6",
    "boto3-stubs[s3]>=1.39.9",
    "mypy>=1.16.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.2.1",
    "respx>=0.22.0",
    "ruff>=0.11.13",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "if __name__ == .__main__.:",
]
omit = [
    "src/**/__init__.py",
    "src/**/config.py",
    "src/**/server.py",
]

[tool.coverage.run]
source = ["src"]

[tool.hatch.build]
packages = ["src/ailtir_mcp"]

[tool.mypy]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
ignore_missing_imports = true
mypy_path = ["src"]
no_implicit_optional = true
python_version = "3.13"
strict_equality = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "."]

[tool.ruff]
include = ["src/**/*.py", "tests/**/*.py"]
line-length = 100
target-version = "py313"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
ignore = ["S101"]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "T20"]
